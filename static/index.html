<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOSPHOR BBS</title>
    <link rel="stylesheet" href="/static/phosphor.css">
</head>
<body>
    <div class="crt">
        <div class="terminal-container">
            <pre id="screen" class="screen" tabindex="0" aria-label="PHOSPHOR terminal"></pre>
            <div class="status">
                <span id="status">CONNECTING</span>
                <span id="online">0 ONLINE</span>
            </div>
        </div>
        <div class="instructions">
            <p>PHOSPHOR BBS &mdash; NODE 001 &mdash; 80x24</p>
            <p>TYPE TO TALK &middot; F12 FAST MODE &middot; CLICK THE SCREEN IF KEYS DO NOTHING</p>
        </div>
    </div>
    <script src="/static/term.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
